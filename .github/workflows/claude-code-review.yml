# Revisa el codigo de cada PR. NO escribe la descripcion (eso es pr-describe.yml).
# Requiere el secret CLAUDE_CODE_OAUTH_TOKEN en Settings > Secrets and variables > Actions.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    # Los forks no pueden leer secrets, y esto evita que alguien queme creditos
    # abriendo PRs si el repo se hace publico.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      issues: write
      # La action pide un token OIDC para identificarse; sin esto falla con
      # "Could not fetch an OIDC token".
      id-token: write

    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Modelo y esfuerzo explicitos: la action no documenta un default, asi
          # que sin esto va cambiando con la version del CLI.
          claude_args: |
            --model opus
            --effort high
            --max-turns 30
